id: sync_costing_smartsheet
namespace: scheduler

triggers:
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"

tasks:
  - id: call_sync_costing_smartsheet_api
    type: io.kestra.plugin.core.http.Request
    uri: "http://tender-executive-dashboard:3126/api/sync-costing-smartsheet"
    method: POST
    headers:
      Authorization: "Bearer {{ secret('KESTRA_EXTERNAL_API_KEY') }}"
      x-api-key: "{{ secret('KESTRA_EXTERNAL_API_KEY') }}"
